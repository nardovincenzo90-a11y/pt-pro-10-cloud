name: PTPROSmartWatch
options:
  bundleIdPrefix: it.ptpro
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  PTPROCore:
    path: Packages/PTPROCore
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  PTPRO:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: PTPROCore
      - target: PTPROWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ptpro.mobile
        CODE_SIGN_ENTITLEMENTS: App/PTPRO.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: PT-PRO
        INFOPLIST_KEY_NSHealthShareUsageDescription: PT-PRO legge frequenza cardiaca e dati dell'allenamento solo con il tuo consenso.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: PT-PRO salva gli allenamenti completati solo con il tuo consenso.
        INFOPLIST_KEY_PTPROSupabaseURL: $(PTPRO_SUPABASE_URL)
        INFOPLIST_KEY_PTPROPublishableKey: $(PTPRO_SUPABASE_PUBLISHABLE_KEY)
        GENERATE_INFOPLIST_FILE: YES
  PTPROWatch:
    type: application
    platform: watchOS
    sources:
      - WatchApp
      - Shared
    dependencies:
      - package: PTPROCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ptpro.mobile.watchkitapp
        CODE_SIGN_ENTITLEMENTS: WatchApp/PTPROWatch.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: PT-PRO
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: it.ptpro.mobile
        INFOPLIST_KEY_NSHealthShareUsageDescription: PT-PRO usa frequenza cardiaca e dati fitness durante l'allenamento.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: PT-PRO salva l'allenamento completato in Salute con il tuo consenso.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: La posizione è richiesta solo per eventuali allenamenti outdoor.
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PTPRO:
    build:
      targets:
        PTPRO: all
        PTPROWatch: all
    run:
      config: Debug
